name: Recobranca automatica

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  processar-fila:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validar URL do cron
        env:
          RECOBRANCA_CRON_URL: ${{ secrets.RECOBRANCA_CRON_URL }}
          RECOBRANCA_CRON_TOKEN: ${{ secrets.RECOBRANCA_CRON_TOKEN }}
          PAINEL_ADMIN_USER: ${{ secrets.PAINEL_ADMIN_USER }}
          PAINEL_ADMIN_PASS: ${{ secrets.PAINEL_ADMIN_PASS }}
        run: |
          RECOBRANCA_CRON_URL="$(printf '%s' "$RECOBRANCA_CRON_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          RECOBRANCA_CRON_TOKEN="$(printf '%s' "$RECOBRANCA_CRON_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          PAINEL_ADMIN_USER="$(printf '%s' "$PAINEL_ADMIN_USER" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          PAINEL_ADMIN_PASS="$(printf '%s' "$PAINEL_ADMIN_PASS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          if [ -z "$RECOBRANCA_CRON_URL" ]; then
            echo "::error::Secret RECOBRANCA_CRON_URL nao configurado ou vazio."
            exit 1
          fi

          case "$RECOBRANCA_CRON_URL" in
            http://*|https://*) ;;
            *)
              echo "::error::Secret RECOBRANCA_CRON_URL precisa comecar com http:// ou https://."
              exit 1
              ;;
          esac

          if printf '%s' "$RECOBRANCA_CRON_URL" | grep -q '[[:space:]]'; then
            echo "::error::Secret RECOBRANCA_CRON_URL contem espacos. Use a URL limpa do cron."
            exit 1
          fi

          if [ -z "$RECOBRANCA_CRON_TOKEN" ] && { [ -z "$PAINEL_ADMIN_USER" ] || [ -z "$PAINEL_ADMIN_PASS" ]; }; then
            echo "::error::Configure RECOBRANCA_CRON_TOKEN ou PAINEL_ADMIN_USER + PAINEL_ADMIN_PASS."
            exit 1
          fi

          echo "URL configurada: ${RECOBRANCA_CRON_URL%%\?*}"
          if [ -n "$RECOBRANCA_CRON_TOKEN" ]; then
            echo "Token configurado: sim (${#RECOBRANCA_CRON_TOKEN} caracteres)"
          else
            echo "Token configurado: nao. Login do painel sera usado."
          fi

      - name: Chamar recobranca
        env:
          RECOBRANCA_CRON_URL: ${{ secrets.RECOBRANCA_CRON_URL }}
          RECOBRANCA_CRON_TOKEN: ${{ secrets.RECOBRANCA_CRON_TOKEN }}
          PAINEL_ADMIN_USER: ${{ secrets.PAINEL_ADMIN_USER }}
          PAINEL_ADMIN_PASS: ${{ secrets.PAINEL_ADMIN_PASS }}
          PAINEL_LOGIN_URL: ${{ secrets.PAINEL_LOGIN_URL }}
          DUE_TODAY_CRON_URL: ${{ secrets.DUE_TODAY_CRON_URL }}
        run: |
          RECOBRANCA_CRON_URL="$(printf '%s' "$RECOBRANCA_CRON_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          RECOBRANCA_CRON_TOKEN="$(printf '%s' "$RECOBRANCA_CRON_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          PAINEL_ADMIN_USER="$(printf '%s' "$PAINEL_ADMIN_USER" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          PAINEL_ADMIN_PASS="$(printf '%s' "$PAINEL_ADMIN_PASS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          PAINEL_LOGIN_URL="$(printf '%s' "$PAINEL_LOGIN_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          DUE_TODAY_CRON_URL="$(printf '%s' "$DUE_TODAY_CRON_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          separator="?"
          case "$RECOBRANCA_CRON_URL" in
            *\?*) separator="&" ;;
          esac

          cron_url="${RECOBRANCA_CRON_URL}${separator}limit=5"
          separator="&"
          cron_url="${cron_url}${separator}token=${RECOBRANCA_CRON_TOKEN}"
          echo "::add-mask::$RECOBRANCA_CRON_TOKEN"
          echo "::add-mask::$PAINEL_ADMIN_USER"
          echo "::add-mask::$PAINEL_ADMIN_PASS"
          echo "::add-mask::$cron_url"
          echo "Chamando cron de recobranca..."

          http_code="$(
            curl --show-error --silent --connect-timeout 15 --max-time 180 \
              --header "X-Cron-Token: ${RECOBRANCA_CRON_TOKEN}" \
              --header "Authorization: Bearer ${RECOBRANCA_CRON_TOKEN}" \
              --output /tmp/recobranca_cron_response.txt \
              --write-out "%{http_code}" \
              "$cron_url"
              || echo "000"
          )"

          if [ "$http_code" = "401" ] && [ -n "$PAINEL_ADMIN_USER" ] && [ -n "$PAINEL_ADMIN_PASS" ]; then
            echo "Token nao autenticou. Tentando login no painel..."

            if [ -z "$PAINEL_LOGIN_URL" ]; then
              PAINEL_LOGIN_URL="$(printf '%s' "$RECOBRANCA_CRON_URL" | sed -E 's#/painel/api/.*#/painel/#')"
            fi

            curl --show-error --silent --connect-timeout 15 --max-time 180 \
              --cookie-jar /tmp/painel_cookies.txt \
              --output /tmp/painel_login_page.html \
              "$PAINEL_LOGIN_URL"

            csrf="$(
              sed -n 's/.*name="csrf" value="\([^"]*\)".*/\1/p' /tmp/painel_login_page.html | head -n 1
            )"

            if [ -z "$csrf" ]; then
              echo "::error::Nao foi possivel capturar o CSRF do login."
              sed -n '1,12p' /tmp/painel_login_page.html
              exit 1
            fi

            curl --show-error --silent --connect-timeout 15 --max-time 180 \
              --cookie /tmp/painel_cookies.txt \
              --cookie-jar /tmp/painel_cookies.txt \
              --location \
              --data-urlencode "csrf=$csrf" \
              --data-urlencode "user=$PAINEL_ADMIN_USER" \
              --data-urlencode "pass=$PAINEL_ADMIN_PASS" \
              --data-urlencode "login=1" \
              --output /tmp/painel_login_response.html \
              "$PAINEL_LOGIN_URL"

            http_code="$(
              curl --show-error --silent --connect-timeout 15 --max-time 180 \
                --cookie /tmp/painel_cookies.txt \
                --output /tmp/recobranca_cron_response.txt \
                --write-out "%{http_code}" \
                "$cron_url"
                || echo "000"
            )"
          fi

          echo "HTTP status: $http_code"
          echo "Resposta:"
          sed -n '1,20p' /tmp/recobranca_cron_response.txt

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Cron retornou HTTP $http_code."
            exit 1
          fi

          if [ -z "$DUE_TODAY_CRON_URL" ]; then
            recobranca_base="${RECOBRANCA_CRON_URL%%\?*}"
            DUE_TODAY_CRON_URL="$(printf '%s' "$recobranca_base" | sed 's#cron_recobranca\.php$#reminders_due_today_cron.php#')"
          fi

          if [ "$DUE_TODAY_CRON_URL" = "$RECOBRANCA_CRON_URL" ]; then
            echo "::warning::Nao consegui derivar a URL do cron vencimento_hoje a partir de RECOBRANCA_CRON_URL."
            exit 0
          fi

          separator="?"
          case "$DUE_TODAY_CRON_URL" in
            *\?*) separator="&" ;;
          esac
          due_today_url="${DUE_TODAY_CRON_URL}${separator}token=${RECOBRANCA_CRON_TOKEN}"
          echo "::add-mask::$due_today_url"
          echo "Chamando cron de vencimento hoje..."

          if [ -f /tmp/painel_cookies.txt ]; then
            due_today_http_code="$(
              curl --show-error --silent --connect-timeout 15 --max-time 180 \
                --cookie /tmp/painel_cookies.txt \
                --header "X-Cron-Token: ${RECOBRANCA_CRON_TOKEN}" \
                --header "Authorization: Bearer ${RECOBRANCA_CRON_TOKEN}" \
                --output /tmp/due_today_cron_response.txt \
                --write-out "%{http_code}" \
                "$due_today_url"
                || echo "000"
            )"
          else
            due_today_http_code="$(
              curl --show-error --silent --connect-timeout 15 --max-time 180 \
                --header "X-Cron-Token: ${RECOBRANCA_CRON_TOKEN}" \
                --header "Authorization: Bearer ${RECOBRANCA_CRON_TOKEN}" \
                --output /tmp/due_today_cron_response.txt \
                --write-out "%{http_code}" \
                "$due_today_url"
                || echo "000"
            )"
          fi

          echo "HTTP status vencimento hoje: $due_today_http_code"
          echo "Resposta vencimento hoje:"
          sed -n '1,20p' /tmp/due_today_cron_response.txt

          if [ "$due_today_http_code" -lt 200 ] || [ "$due_today_http_code" -ge 300 ]; then
            echo "::error::Cron vencimento hoje retornou HTTP $due_today_http_code."
            exit 1
          fi
