<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Jogo da Velha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css?v=20260905-1" />
</head>
<body>
  <div class="decor decor-one"></div><div class="decor decor-two"></div>
  <header class="topbar">
    <a class="brand" href="index.html"><span data-icon="gamepad"></span> Play Duo</a>
    <div class="topbar-right"><span class="online-dot"></span><span id="topbarPlayers"></span><button class="btn btn-ghost" id="logoutBtn">Sair</button></div>
  </header>

  <main class="card game-card">
    <div class="game-heading"><div><span class="eyebrow">DUELO 1 × 1</span><h1>Jogo da Velha</h1></div><span class="heading-icon" data-icon="circle"></span></div>
    <div class="scoreboard">
      <div class="score-pill player-one"><div class="avatar">X</div><div><div class="name" id="score1Name">Jogador 1</div><div class="value" id="score1Value">0</div></div></div>
      <div class="score-pill draws"><div class="name">EMPATES</div><div class="value" id="scoreDrawValue">0</div></div>
      <div class="score-pill player-two"><div><div class="name" id="score2Name">Jogador 2</div><div class="value" id="score2Value">0</div></div><div class="avatar">O</div></div>
    </div>
    <div class="status-bar" id="statusBar"></div>
    <div class="board" id="board" aria-label="Tabuleiro do jogo da velha"></div>
    <div class="actions-row"><button class="btn btn-secondary" id="restartRoundBtn">↻ Nova rodada</button><button class="btn btn-soft" id="resetScoreBtn">Zerar placar</button></div>
    <div class="back-row"><button class="back-link" id="backToMenuBtn">← Voltar aos jogos</button></div>
  </main>

  <div class="pause-overlay" id="pauseOverlay" aria-hidden="true">
    <div class="pause-box"><div class="pause-character" data-icon="wave"></div><span class="eyebrow">PARTIDA PAUSADA</span><h2><span data-opponent-name>O outro jogador</span> está ausente</h2><p>O jogo está seguro. Estamos aguardando a pessoa voltar...</p><div class="waiting-dots"><i></i><i></i><i></i></div></div>
  </div>
  <script src="client.js?v=20260904-3"></script><script src="icons.js?v=20260905-2"></script><script src="velha.js?v=20260904-3"></script>
</body>
</html>
