<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo da Velha</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-nav">
      <a href="index.html">🎮 Jogos</a>
    </div>
    <div class="topbar-right">
      <span id="topbarPlayers"></span>
      <button class="btn btn-ghost" id="logoutBtn" style="padding:6px 14px;">Sair</button>
    </div>
  </div>

  <div class="card">
    <h1>Jogo da Velha</h1>

    <div class="scoreboard">
      <div class="score-pill">
        <div class="name" id="score1Name">Jogador 1</div>
        <div class="value" id="score1Value">0</div>
      </div>
      <div class="score-pill">
        <div class="name">Empates</div>
        <div class="value" id="scoreDrawValue">0</div>
      </div>
      <div class="score-pill">
        <div class="name" id="score2Name">Jogador 2</div>
        <div class="value" id="score2Value">0</div>
      </div>
    </div>

    <div class="status-bar" id="statusBar"></div>

    <div class="board" id="board"></div>

    <div class="actions-row">
      <button class="btn btn-secondary" id="restartRoundBtn">Reiniciar rodada</button>
      <button class="btn btn-secondary" id="resetScoreBtn">Zerar placar</button>
    </div>

    <div style="text-align:center;">
      <button class="back-link" id="backToMenuBtn" style="background:none;border:none;cursor:pointer;font-family:inherit;">&larr; Voltar ao menu</button>
    </div>
  </div>

  <script src="client.js"></script>
  <script src="velha.js"></script>
</body>
</html>
